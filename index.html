<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEN STORE - AIM SHOP</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}header{background:#111;padding:15px;text-align:center;color:#FFCC00;font-weight:900;border-bottom:2px solid #FFCC00}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#1a1a1a;border-radius:14px;padding:12px;text-align:center;border:1px solid #333}.price{color:#FFCC00;font-weight:900;margin:6px 0}.btn{width:100%;background:#FFCC00;color:#000;border:none;padding:10px;border-radius:99px;font-weight:900}.cart{position:fixed;bottom:0;left:0;right:0;background:#fff;color:#000;border-radius:20px 20px 0 0;padding:16px;transform:translateY(110%);transition:.3s;z-index:99}.cart.open{transform:translateY(0)}.bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:98}.bg.open{display:block}</style></head><body><header>ZEN STORE - DIGITAL GAMING STORE<br><small style="color:#fff">ZALOPAY: 0355417385 - HOANG BAO NAM</small></header><div class="grid" id="grid"></div><div class="bg" id="bg" onclick="toggleCart()"></div><div class="cart" id="cartBox"><h3>Gio hang</h3><div id="items">Trong</div><h3 style="margin-top:10px">Tong: <span id="total">0</span>d</h3><input id="uid" placeholder="Nhap UID Game" style="width:100%;padding:11px;border-radius:10px;border:1px solid #ccc;margin-top:8px"><input id="sdt" placeholder="SDT Zalo" style="width:100%;padding:11px;border-radius:10px;border:1px solid #ccc;margin-top:6px"><button class="btn" style="background:#0068FF;color:#fff;margin-top:10px" onclick="createPay()">TAO QR ZALOPAY TU DONG</button><div id="payArea"></div></div><button onclick="toggleCart()" style="position:fixed;bottom:20px;right:20px;width:62px;height:62px;border-radius:50%;background:#FFCC00;border:none;font-size:28px;z-index:97">🛒</button><script>const products=[{id:0,name:"MENU AN VIP",price:150000},{id:1,name:"KEY PRX 1 NGAY",price:30000},{id:2,name:"KEY PRX 7 NGAY",price:150000},{id:3,name:"KEY PRX 30 NGAY",price:400000},{id:4,name:"AIMBOT + ANTIBAN",price:250000},{id:5,name:"COMBO FULL VIP",price:550000}];let cart=[];const grid=document.getElementById('grid');products.forEach(p=>{grid.innerHTML+=`<div class="card"><div style="font-size:48px">🎯</div><div style="font-weight:800;margin-top:6px">${p.name}</div><div class="price">${p.price.toLocaleString()}d</div><button class="btn" onclick="addToCart(${p.id})">Mua ngay</button></div>`});function addToCart(id){let f=cart.find(x=>x.id===id);if(f)f.qty++;else{let pr=products.find(x=>x.id===id);cart.push({...pr,qty:1})}updateCart();toggleCart()}function updateCart(){let html="",sum=0;cart.forEach(c=>{sum+=c.price*c.qty;html+=`<div style="display:flex;justify-content:space-between;margin:6px 0"><span>${c.name} x${c.qty}</span><b>${(c.price*c.qty).toLocaleString()}d</b></div>`});document.getElementById('items').innerHTML=html||"Trong";document.getElementById('total').innerText=sum.toLocaleString()}function toggleCart(){document.getElementById('cartBox').classList.toggle('open');document.getElementById('bg').classList.toggle('open')}function createPay(){let uid=document.getElementById('uid').value;let sdt=document.getElementById('sdt').value;if(!uid||!sdt||!cart.length){alert("Nhap UID + SDT va chon mon");return}let total=0;cart.forEach(c=>total+=c.price*c.qty);let orderCode="ZEN"+Date.now().toString().slice(-6);let qrUrl="https://img.vietqr.io/image/MB-0355417385-compact2.png?amount="+total+"&addInfo="+orderCode+"&accountName=HOANG%20BAO%20NAM";document.getElementById('payArea').innerHTML=`<div style="border:2px solid #0068FF;border-radius:14px;padding:12px;margin-top:12px;text-align:center"><b style="color:#0068FF">THANH TOAN TU DONG</b><br>Ma don: <b style="color:red">${orderCode}</b> - ${total.toLocaleString()}d<br><img src="${qrUrl}" style="width:260px;border-radius:12px;margin:10px auto;display:block"><div style="background:#FFF3CD;padding:8px;border-radius:8px;font-size:13px">Mo ZaloPay -> Quet QR nay<br>Noi dung CK phai la <b style="color:red">${orderCode}</b></div><a href="https://zalo.me/0355417385" target="_blank" style="display:block;background:#000;color:#fff;padding:12px;border-radius:99px;text-decoration:none;margin-top:10px;text-align:center;font-weight:800">Chat Zalo 0355417385 lay Key</a></div>`}</script></body></html>
